<!DOCTYPE html>
<html lang="{{.Lang}}" dir="{{.Dir}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{{.SysName}}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/asr.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-microphone-alt"></i> {{.SysName}}</h1>
            <div class="model-info">
                <span>支持格式: MP3, M4A, AMR, WAV, FLAC, OGG, AAC</span>
                <div class="model-info-actions">
                    <a href="/asr/task?uid={{.UID}}&app_source={{.AppSource}}&t={{.Token}}" class="btn-tasks" target="_blank">
                        <i class="fas fa-tasks"></i> 我的任务
                    </a>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="welcome-section">
                <i class="fas fa-head-side-microphone" style="font-size: 56px; color: #4b6cb7; margin-bottom: 16px;"></i>
                <p class="welcome-title">🎙️ 上传音频文件，自动转换为文字</p>
                <p class="welcome-desc">支持 MP3、M4A、AMR、WAV、FLAC、OGG、AAC 等格式</p>
            </div>

            <div class="upload-result" id="uploadResult" style="display: none;"></div>

            <div class="input-area">
                <div class="input-container">
                    <div class="input-wrapper">
                        <div class="file-list-container" id="fileListContainer" style="display: none;">
                            <div class="file-list-header">
                                <span>已选择文件:</span>
                                <button class="clear-files-btn" onclick="clearFileList()">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                            <div class="file-list" id="fileList"></div>
                        </div>
                    </div>

                    <div class="input-actions">
                        <div class="config-info">
                            <span class="config-item">
                                <i class="fas fa-microphone"></i>
                                <span>音频转文字</span>
                            </span>
                        </div>
                        <div class="input-buttons">
                            <div class="file-upload-btn-container">
                                <input type="file" id="fileInput" multiple accept=".mp3,.m4a,.amr,.wav,.flac,.ogg,.aac">
                                <button id="uploadButton" class="btn-attach" title="上传音频文件">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span class="btn-text">选择文件</span>
                                </button>
                                <div class="file-count-badge" id="fileCountBadge" style="display: none;">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="input-hint">
                    <small>点击上传按钮选择音频文件，系统将自动转换为文字</small>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>Powered by FunASR &amp; FFmpeg</p>
        </footer>
    </div>

    <input type="hidden" id="uid" name="uid" value="{{.UID}}">
    <input type="hidden" id="t" name="t" value="{{.Token}}">
    <input type="hidden" id="appSource" name="appSource" value="{{.AppSource}}">

    <script>window.__I18N__ = {{.I18NJS}}; window.__LANG__ = "zh";</script>
    <script type="text/javascript" src="/static/i18n.js"></script>
    <script src="/static/asr.js"></script>
</body>
</html>
